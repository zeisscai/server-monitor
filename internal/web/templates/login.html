{{define "login.html"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>登录 · 服务器监控</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><span class="brand-dot"></span></div>
    <h1>服务器监控</h1>
    <p class="muted">{{.Hostname}}</p>

    {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}

    <form method="post" action="/login" class="login-form" autocomplete="off">
      <label class="field">
        <span>账号</span>
        <input type="text" name="username" placeholder="请输入账号" autofocus required>
      </label>
      <label class="field">
        <span>密码</span>
        <input type="password" name="password" placeholder="请输入密码" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <p class="login-hint muted">账号与密码由部署初始化脚本设置，已保存在服务器 config 配置文件中。</p>
  </div>
</div>
</body>
</html>{{end}}
